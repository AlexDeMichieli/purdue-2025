<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Restaurant Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen">
    <header class="bg-amber-700 text-white p-6 shadow-lg">
        <h1 class="text-3xl font-bold text-center">Burger Paradise</h1>
    </header>

    <main class="container mx-auto py-8 px-4">
        <h2 class="text-2xl font-bold text-center mb-8">Our Burgers</h2>
        
        <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Burgers will be loaded here -->
            <p class="text-center col-span-full">Loading menu...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('burgers.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    displayBurgers(data);
                })
                .catch(error => {
                    document.getElementById('menu-container').innerHTML = `
                        <p class="text-red-500 text-center col-span-full">
                            Failed to load menu. Please try again later.
                        </p>
                    `;
                    console.error('Error fetching burgers:', error);
                });
        });

        function displayBurgers(burgers) {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';

            burgers.forEach(burger => {
                const burgerCard = document.createElement('div');
                burgerCard.className = 'bg-white rounded-lg shadow-md overflow-hidden';
                burgerCard.innerHTML = `
                    <div class="p-4">
                        <h3 class="font-bold text-xl mb-2">${burger.name}</h3>
                        <p class="text-gray-700 mb-2">${burger.description}</p>
                        <p class="text-amber-700 font-bold">$${burger.price.toFixed(2)}</p>
                    </div>
                `;
                menuContainer.appendChild(burgerCard);
            });
        }
    </script>
</body>
</html>
